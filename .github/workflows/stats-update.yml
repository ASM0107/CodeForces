name: Update Stats

on:
  push:
    branches: [main]
    paths: ['contests/**/*.cpp']
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run README and Stats Updater
        run: python3 .github/scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json README.md
          git diff --cached --quiet || (git commit -m "chore: update stats and badges [skip ci]" && git push)
